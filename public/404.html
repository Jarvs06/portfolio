<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Jarvey Ilano</title>
    <style>
      :root { --bg:#fff; --text:#171717; --muted:#737373; --border:#eaeaea; --accent:#2563eb; --on-accent:#fff; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#111113; --text:#ededed; --muted:#a1a1a1; --border:#27272a; --accent:#5b8def; --on-accent:#0b1220; }
      }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; }
      main { max-width: 440px; }
      .code { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
      h1 { margin-top: 8px; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; }
      p { margin-top: 12px; color: var(--muted); }
      a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 24px; padding: 0 20px; border-radius: 6px;
        background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 500; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>The link may be out of date, or the address may have a typo. The portfolio is a single page, so everything lives on the home page.</p>
      <a id="home" href="/">Go to the home page</a>
    </main>
    <script>
      // On a project site (USERNAME.github.io/REPO-NAME/) the home page lives under
      // /REPO-NAME/. Detect that so this link works without editing.
      (function () {
        var host = location.hostname;
        var first = location.pathname.split('/').filter(Boolean)[0];
        if (/\.github\.io$/.test(host) && first) {
          document.getElementById('home').href = '/' + first + '/';
        }
      })();
    </script>
  </body>
</html>
